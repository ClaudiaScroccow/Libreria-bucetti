<!DOCTYPE html>
<html lang="it">

<head>

    <style>
        :root {
            --bg-color: #f3efe6;
            --card-bg: #fffcf8;
            --primary-color: #2e4033;
            --accent-color: #557a46;
            --accent-hover: #436136;
            --danger-color: #b83b3b;
            --danger-hover: #962f2f;
            --text-color: #232c25;
            --text-light: #607064;
            --border-color: #d6e2d9;
            --badge-bg: #e2ede5;
            --badge-color: #314a36;
            --clo-bg: #e1f5fe;
            --clo-color: #01579b;
            --maki-bg: #fce4ec;
            --maki-color: #880e4f;
            --both-bg: #e8f5e9;
            --both-color: #1b5e20;
            --unread-bg: #fce4d6;
            --unread-color: #c65911;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 30px 20px;
            background-image: radial-gradient(#cbdad0 1px, transparent 1px), radial-gradient(#cbdad0 1px, var(--bg-color) 1px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 25px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.75);
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(46, 64, 51, 0.05);
        }

        .header-titles h1 {
            color: var(--primary-color);
            font-size: 2.3rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .header-titles p {
            color: var(--text-light);
            font-size: 1.05rem;
            font-style: italic;
            margin-bottom: 20px;
        }

        .header-filters-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .search-container {
            position: relative;
            width: 260px;
        }

        .search-container input,
        .filter-select {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #fff;
            color: var(--text-color);
            transition: all 0.2s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .filter-select {
            padding-left: 14px;
            width: 180px;
            cursor: pointer;
        }

        .search-container input:focus,
        .filter-select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(85, 122, 70, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .filter-pills-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.6);
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            align-items: center;
        }

        .filter-pill {
            background-color: #fff;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .filter-pill:hover {
            border-color: var(--accent-color);
            background-color: #f0f5f1;
        }

        .filter-pill.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 2px 6px rgba(46, 64, 51, 0.2);
        }

        .filter-pill-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-light);
            margin-right: 5px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .btn-toggle-form {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(46, 64, 51, 0.1);
        }

        .btn-toggle-form:hover {
            background-color: #213025;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 6px 15px rgba(46, 64, 51, 0.06);
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        #formCard {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 1.35rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--primary-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fff;
            color: var(--text-color);
            transition: all 0.2s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(85, 122, 70, 0.15);
        }

        button[type="submit"] {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        button[type="submit"]:hover {
            background-color: var(--accent-hover);
        }

        .btn-scanner {
            background-color: #3b5998;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background 0.2s;
        }

        .btn-scanner:hover {
            background-color: #2d4373;
        }

        #reader-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 15px auto;
            display: none;
        }

        .author-item {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            background: var(--card-bg);
            transition: box-shadow 0.2s;
        }

        .author-item:hover {
            box-shadow: 0 4px 10px rgba(46, 64, 51, 0.05);
        }

        .author-header {
            background: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .author-header:hover {
            background: #f4f8f5;
        }

        .author-name {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .author-badge {
            background: var(--badge-bg);
            color: var(--badge-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .author-content {
            display: none;
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            background: #f5f9f6;
        }

        .author-item.active .author-content {
            display: block;
        }

        .book-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .book-info h4 {
            font-size: 1.05rem;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .book-info p {
            font-size: 0.9rem;
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .book-tags {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .genre-tag {
            background: #e8f0eb;
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .read-status {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .read-status.clo {
            background: var(--clo-bg);
            color: var(--clo-color);
        }

        .read-status.maki {
            background: var(--maki-bg);
            color: var(--maki-color);
        }

        .read-status.entrambi {
            background: var(--both-bg);
            color: var(--both-color);
        }

        .read-status.nessuno {
            background: var(--unread-bg);
            color: var(--unread-color);
        }

        .book-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .copies-badge {
            background: #e8f0eb;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--primary-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            width: auto;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background-color: var(--danger-hover);
        }

        .empty-state {
            text-align: center;
            color: var(--text-light);
            padding: 25px;
            font-style: italic;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--accent-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div class="header-titles">
                <h1>Biblioteca virtuale dei bucetti topolinetti 🌿</h1>
                <p>Collezione letteraria e archivio delle letture di Clo & Maki</p>
            </div>
            <div class="header-filters-row">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Cerca libro o autore..." oninput="renderLibrary()">
                </div>
                <button class="btn-toggle-form" onclick="toggleForm()">
                    <span>🌱 Aggiungi un Nuovo Libro</span>
                </button>
                <select id="authorFilter" class="filter-select" onchange="renderLibrary()">
                    <option value="">Tutti gli autori</option>
                </select>
            </div>
        </header>

        <!-- Barra Pulsanti Generi -->
        <div class="filter-pills-bar" id="genrePillsBar">
            <span class="filter-pill-label">Genere:</span>
            <button class="filter-pill active" onclick="setGenreFilter('')">Tutti i generi</button>
            <button class="filter-pill" onclick="setGenreFilter('Romanzi')">Romanzi</button>
            <button class="filter-pill" onclick="setGenreFilter('Manga&Artbook')">Manga&Artbook</button>
            <button class="filter-pill" onclick="setGenreFilter('Graphic Novel')">Graphic Novel</button>
            <button class="filter-pill" onclick="setGenreFilter('Fanfiction')">Fanfiction</button>
            <button class="filter-pill" onclick="setGenreFilter('Libri di Studio')">Libri di Studio</button>
            <button class="filter-pill" onclick="setGenreFilter('Libri di musica')">Libri di musica</button>
            <button class="filter-pill" onclick="setGenreFilter('Poesia')">Poesia</button>
        </div>

        <!-- Barra Pulsanti Lettore -->
        <div class="filter-pills-bar" id="readerPillsBar">
            <span class="filter-pill-label">Lettore:</span>
            <button class="filter-pill active" onclick="setReaderFilter('')">Tutti</button>
            <button class="filter-pill" onclick="setReaderFilter('Clo')">Letto da Clo</button>
            <button class="filter-pill" onclick="setReaderFilter('Maki')">Letto da Maki</button>
            <button class="filter-pill" onclick="setReaderFilter('Entrambi')">Entrambi</button>
            <button class="filter-pill" onclick="setReaderFilter('Nessuno')">Non letto</button>
        </div>

        <div class="card" id="formCard">
            <h2>Aggiungi un Nuovo Libro</h2>
            
            <!-- Pulsante e box per la fotocamera scanner -->
            <button type="button" class="btn-scanner" onclick="avviaScanner()">📸 Scansiona Codice a Barre (ISBN)</button>
            <div id="reader-container">
                <div id="reader"></div>
                <button type="button" class="btn-delete" style="margin-top: 10px; width: 100%;" onclick="chiudiScanner()">Chiudi Fotocamera</button>
            </div>

            <form id="bookForm">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="titolo">Titolo del libro *</label>
                        <input type="text" id="titolo" required placeholder="es. Grandi Speranze">
                    </div>
                    <div class="form-group">
                        <label for="autore">Autore *</label>
                        <input type="text" id="autore" required placeholder="es. Charles Dickens">
                    </div>
                    <div class="form-group">
                        <label for="genere">Genere Letterario</label>
                        <select id="genere">
                            <option value="Romanzi">Romanzi</option>
                            <option value="Manga&Artbook">Manga&Artbook</option>
                            <option value="Graphic Novel">Graphic Novel</option>
                            <option value="Fanfiction">Fanfiction</option>
                            <option value="Libri di Studio">Libri di Studio</option>
                            <option value="Libri di musica">Libri di musica</option>
                            <option value="Poesia">Poesia</option>
                            <option value="Altro">Altro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editore">Casa Editrice</label>
                        <input type="text" id="editore" placeholder="es. Feltrinelli">
                    </div>
                    <div class="form-group">
                        <label for="anno">Anno di pubblicazione</label>
                        <input type="text" id="anno" placeholder="es. 1861">
                    </div>
                    <div class="form-group">
                        <label for="copie">Numero di copie</label>
                        <input type="number" id="copie" min="1" value="1">
                    </div>
                    <div class="form-group full">
                        <label for="lettoDa">Chi lo ha letto?</label>
                        <select id="lettoDa">
                            <option value="Nessuno">Nessuno (Non ancora letto)</option>
                            <option value="Clo">Clo</option>
                            <option value="Maki">Maki</option>
                            <option value="Entrambi">Entrambi</option>
                        </select>
                    </div>
                </div>
                <button type="submit">Salva nella Libreria</button>
            </form>
        </div>

        <div class="card">
            <h2>📚 Catalogo per Autore</h2>
            <div class="stats" id="statsBar"></div>
            <div id="authorsList"></div>
        </div>
    </div>

            { id: "1710000000143", titolo: "La sonnambula", autore: "Bianca Pitzorno", genere: "Romanzi", editore: "Non specificato", anno: "Non specificato", copie: 1, lettoDa: "Nessuno" },
            { id: "1710000000144", titolo: "La ballata di Rohan McCoy", autore: "Colin Morgan", genere: "Romanzi", editore: "Non specificato", anno: "Non specificato", copie: 1, lettoDa: "Nessuno" }
        ];

        let libri = JSON.parse(localStorage.getItem('libreria_calda_v8_6'));
        if (!libri || libri.length === 0) {
            libri = defaultBooks;
            localStorage.setItem('libreria_calda_v8_6', JSON.stringify(libri));
        }

        let selectedGenre = "";
        let selectedReader = "";
        let html5QrCode = null;

        const bookForm = document.getElementById('bookForm');
        const formCard = document.getElementById('formCard');
        const authorsList = document.getElementById('authorsList');
        const searchInput = document.getElementById('searchInput');
        const authorFilter = document.getElementById('authorFilter');
        const statsBar = document.getElementById('statsBar');
        const genrePillsBar = document.getElementById('genrePillsBar');
        const readerPillsBar = document.getElementById('readerPillsBar');

        function toggleForm() {
            if (formCard.style.display === 'block') {
                formCard.style.display = 'none';
                chiudiScanner();
            } else {
                formCard.style.display = 'block';
            }
        }

        // --- GESTIONE FOTOCAMERA E SCANNER ISBN ---
        function avviaScanner() {
            const container = document.getElementById('reader-container');
            container.style.display = 'block';
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" }, 
                {
                    fps: 10,
                    qrbox: { width: 250, height: 100 }
                },
                (decodedText, decodedResult) => {
                    chiudiScanner();
                    cercaLibroPerIsbn(decodedText);
                },
                (errorMessage) => {}
            ).catch((err) => {
                alert("Impossibile accedere alla fotocamera. Assicurati di aver dato i permessi o di usare una connessione sicura (HTTPS / localhost).");
                console.error(err);
            });
        }

        function chiudiScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader-container').style.display = 'none';
                }).catch(err => {
                    console.error("Errore nella chiusura dello scanner", err);
                });
            } else {
                document.getElementById('reader-container').style.display = 'none';
            }
        }

        // --- RICERCA MULTIPLA CON FALLBACK (Google Books + Open Library) ---
        async function cercaLibroPerIsbn(isbn) {
            isbn = isbn.trim();
            alert("Codice scansionato: " + isbn + "\nCerco i dati del libro online...");

            // Tentativo 1: Google Books
            let trovato = await cercaGoogleBooks(isbn);
            if (trovato) return;

            // Tentativo 2: Open Library (Fallback se Google fallisce)
            let trovatoOpenLibrary = await cercaOpenLibrary(isbn);
            if (trovatoOpenLibrary) return;

            alert("Non sono riuscito a trovare automaticamente i dettagli con questo ISBN. Inseriscili manualmente nei campi sottostanti.");
        }

        async function cercaGoogleBooks(isbn) {
            try {
                let risposta = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
                let dati = await risposta.json();

                if (dati.totalItems > 0 && dati.items) {
                    let info = dati.items[0].volumeInfo;
                    document.getElementById('titolo').value = info.title || "";
                    document.getElementById('autore').value = info.authors ? info.authors.join(", ") : "";
                    document.getElementById('editore').value = info.publisher || "";
                    document.getElementById('anno').value = info.publishedDate ? info.publishedDate.substring(0, 4) : "";
                    return true;
                }
            } catch (e) {
                console.log("Errore Google Books", e);
            }
            return false;
        }

        async function cercaOpenLibrary(isbn) {
            try {
                const response = await fetch(`https://openlibrary.org/isbn/${isbn}.json`);
                if (!response.ok) return false;
                const data = await response.json();

                if (data.title) {
                    document.getElementById('titolo').value = data.title;
                }

                if (data.publishers && data.publishers.length > 0) {
                    document.getElementById('editore').value = data.publishers[0];
                }

                if (data.publish_date) {
                    document.getElementById('anno').value = data.publish_date;
                }

                if (data.authors && data.authors.length > 0) {
                    const authorKey = data.authors[0].key;
                    const authResponse = await fetch(`https://openlibrary.org${authorKey}.json`);
                    if (authResponse.ok) {
                        const authData = await authResponse.json();
                        if (authData.name) {
                            document.getElementById('autore').value = authData.name;
                        }
                    }
                }
                return true;
            } catch (error) {
                console.log("Errore Open Library", error);
            }
            return false;
        }

        function setGenreFilter(genre) {
            selectedGenre = genre;
            const pills = genrePillsBar.querySelectorAll('.filter-pill');
            pills.forEach(p => {
                if ((genre === "" && p.textContent === "Tutti i generi") || p.textContent === genre) {
                    p.classList.add('active');
                } else {
                    p.classList.remove('active');
                }
            });
            renderLibrary();
        }

        function setReaderFilter(reader) {
            selectedReader = reader;
            const pills = readerPillsBar.querySelectorAll('.filter-pill');
            pills.forEach(p => {
                if ((reader === "" && p.textContent === "Tutti") ||
                    (reader === "Clo" && p.textContent === "Letto da Clo") ||
                    (reader === "Maki" && p.textContent === "Letto da Maki") ||
                    (reader === "Entrambi" && p.textContent === "Entrambi") ||
                    (reader === "Nessuno" && p.textContent === "Non letto")) {
                    p.classList.add('active');
                } else {
                    p.classList.remove('active');
                }
            });
            renderLibrary();
        }

        bookForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const nuovoLibro = {
                id: Date.now().toString(),
                titolo: document.getElementById('titolo').value.trim(),
                autore: document.getElementById('autore').value.trim(),
                genere: document.getElementById('genere').value,
                editore: document.getElementById('editore').value.trim() || 'Non specificato',
                anno: document.getElementById('anno').value.trim() || 'Non specificato',
                copie: parseInt(document.getElementById('copie').value) || 1,
                lettoDa: document.getElementById('lettoDa').value
            };

            libri.push(nuovoLibro);
            salvaEAggiorna();
            bookForm.reset();
            document.getElementById('copie').value = 1;
            document.getElementById('lettoDa').value = "Nessuno";
            document.getElementById('genere').value = "Romanzi";
            formCard.style.display = 'none';
        });

        function salvaEAggiorna() {
            localStorage.setItem('libreria_calda_v8_6', JSON.stringify(libri));
            updateSelectOptions();
            renderLibrary();
        }

        function eliminaLibro(id) {
            if (confirm("Vuoi rimuovere questo libro dalla libreria?")) {
                libri = libri.filter(libro => libro.id !== id);
                salvaEAggiorna();
            }
        }

        function updateSelectOptions() {
            const currentAuthor = authorFilter.value;
            const authors = Array.from(new Set(libri.map(l => l.autore))).sort();
            authorFilter.innerHTML = '<option value="">Tutti gli autori</option>';
            authors.forEach(a => {
                const opt = document.createElement('option');
                opt.value = a;
                opt.textContent = a;
                if (a === currentAuthor) opt.selected = true;
                authorFilter.appendChild(opt);
            });
        }

        function renderLibrary() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedAuthor = authorFilter.value;

            const libriFiltrati = libri.filter(l => {
                const matchSearch = l.autore.toLowerCase().includes(searchTerm) ||
                    l.titolo.toLowerCase().includes(searchTerm) ||
                    l.editore.toLowerCase().includes(searchTerm) ||
                    (l.genere && l.genere.toLowerCase().includes(searchTerm));

                const matchAuthor = !selectedAuthor || l.autore === selectedAuthor;
                const matchGenre = !selectedGenre || (l.genere || 'Non specificato') === selectedGenre;

                let matchReader = true;
                if (selectedReader) {
                    matchReader = (l.lettoDa === selectedReader);
                }

                return matchSearch && matchAuthor && matchGenre && matchReader;
            });

            const totalAutori = new Set(libri.map(l => l.autore)).size;
            const totalCopie = libri.reduce((sum, l) => sum + l.copie, 0);
            const totalLettiClo = libri.filter(l => l.lettoDa === 'Clo' || l.lettoDa === 'Entrambi').length;
            const totalLettiMaki = libri.filter(l => l.lettoDa === 'Maki' || l.lettoDa === 'Entrambi').length;

            statsBar.innerHTML = `<span>Autori: ${totalAutori}</span><span>Volumi totali: ${totalCopie}</span><span>Letti Clo: ${totalLettiClo}</span><span>Letti Maki: ${totalLettiMaki}</span>`;

            if (libriFiltrati.length === 0) {
                authorsList.innerHTML = `<div class="empty-state">Nessun libro trovato con i filtri selezionati.</div>`;
                return;
            }

            const autoriDict = {};
            libriFiltrati.forEach(libro => {
                if (!autoriDict[libro.autore]) {
                    autoriDict[libro.autore] = [];
                }
                autoriDict[libro.autore].push(libro);
            });

            const autoriOrdinati = Object.keys(autoriDict).sort();
            let html = '';

            autoriOrdinati.forEach((autore) => {
                const opere = autoriDict[autore];
                const copieAutore = opere.reduce((sum, l) => sum + l.copie, 0);

                let badgeText = `${opere.length}`;
                if (copieAutore !== opere.length) {
                    badgeText = `${opere.length} (${copieAutore})`;
                }

                html = html + `
                    <div class="author-item">
                        <div class="author-header" onclick="toggleAuthor(this)">
                            <span class="author-name">📖 ${autore}</span>
                            <span class="author-badge">${badgeText}</span>
                        </div>
                        <div class="author-content">
                `;

                opere.forEach(libro => {
                    let statusClass = 'nessuno';
                    let statusText = '⏳ Non letto';

                    if (libro.lettoDa === 'Clo') {
                        statusClass = 'clo';
                        statusText = '👤 Letto da Clo';
                    } else if (libro.lettoDa === 'Maki') {
                        statusClass = 'maki';
                        statusText = '👤 Letto da Maki';
                    } else if (libro.lettoDa === 'Entrambi') {
                        statusClass = 'entrambi';
                        statusText = '👥 Letto da entrambi';
                    }

                    const genere = libro.genere || 'Non specificato';

                    html = html + `
                        <div class="book-card">
                            <div class="book-info">
                                <h4>📜 ${libro.titolo}</h4>
                                <p>Editore: <strong>${libro.editore}</strong> &bull; Anno: <strong>${libro.anno}</strong></p>
                                <div class="book-tags">
                                    <span class="genre-tag">🏷️ ${genere}</span>
                                    <span class="read-status ${statusClass}">${statusText}</span>
                                </div>
                            </div>
                            <div class="book-actions">
                                <span class="copies-badge">Copie: ${libro.copie}</span>
                                <button class="btn-delete" onclick="eliminaLibro('${libro.id}')">Rimuovi</button>
                            </div>
                        </div>
                    `;
                });

                html = html + `</div></div>`;
            });

            authorsList.innerHTML = html;
        }

        function toggleAuthor(headerElement) {
            const item = headerElement.parentElement;
            const content = item.querySelector('.author-content');
            if (content.style.display === 'block') {
                content.style.display = 'none';
            } else {
                content.style.display = 'block';
            }
        }

        updateSelectOptions();
        renderLibrary();
    </script>
</body>

</html>
