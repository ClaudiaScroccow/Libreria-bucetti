<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La mia Libreria</title>
    <!-- Libreria per la scansione dei codici a barre -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .btn { display: block; width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; text-align: center; }
        .btn:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        label { font-weight: bold; color: #555; }
        #reader { width: 100%; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>La mia Libreria Personale</h2>

    <button class="btn" id="btn-avvia-scanner" onclick="avviaScanner()">📸 Scansiona Codice a Barre (ISBN)</button>
    <div id="reader"></div>
    <button class="btn btn-danger" id="btn-chiudi-scanner" style="display:none;" onclick="chiudiScanner()">Chiudi Fotocamera</button>

    <hr style="margin: 20px 0;">

    <div id="form-libro">
        <label>ISBN</label>
        <input type="text" id="isbn" placeholder="Codice ISBN">

        <label>Titolo del libro *</label>
        <input type="text" id="titolo" placeholder="es. Il nome della rosa">

        <label>Autore *</label>
        <input type="text" id="autore" placeholder="es. Umberto Eco">

        <label>Casa Editrice</label>
        <input type="text" id="editore" placeholder="es. Bompiani">

        <label>Anno di pubblicazione</label>
        <input type="text" id="anno" placeholder="es. 1980">

        <button class="btn" onclick="salvaLibro()">Salva Libro</button>
    </div>
</div>

<script>
    let html5QrCode;

    function avviaScanner() {
        document.getElementById('reader').style.display = 'block';
        document.getElementById('btn-chiudi-scanner').style.display = 'block';
        document.getElementById('btn-avvia-scanner').style.display = 'none';

        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 150 } },
            async (decodedText) => {
                // Trovato il codice a barre!
                document.getElementById('isbn').value = decodedText;
                chiudiScanner();
                
                // Cerca automaticamente con Google Books
                await cercaLibroPerGoogleBooks(decodedText);
            },
            (errorMessage) => {
                // Errori di scansione ignorati per fluidità
            }
        ).catch(err => {
            alert("Impossibile accedere alla fotocamera. Assicurati di usare una connessione HTTPS.");
            chiudiScanner();
        });
    }

    function chiudiScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                document.getElementById('btn-chiudi-scanner').style.display = 'none';
                document.getElementById('btn-avvia-scanner').style.display = 'block';
            }).catch(err => {
                console.error("Errore nella chiusura dello scanner", err);
            });
        }
    }

    async function cercaLibroPerGoogleBooks(isbn) {
        try {
            let risposta = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
            let dati = await risposta.json();

            if (dati.totalItems > 0 && dati.items) {
                let info = dati.items[0].volumeInfo;
                document.getElementById('titolo').value = info.title || "";
                document.getElementById('autore').value = info.authors ? info.authors.join(", ") : "";
                document.getElementById('editore').value = info.publisher || "";
                document.getElementById('anno').value = info.publishedDate ? info.publishedDate.substring(0, 4) : "";
            } else {
                alert("Non trovato automaticamente su Google Books. Inserisci i dati manualmente.");
            }
        } catch (errore) {
            console.error("Errore di connessione:", errore);
            alert("Errore durante la ricerca online del libro.");
        }
    }

    function salvaLibro() {
        let titolo = document.getElementById('titolo').value;
        let autore = document.getElementById('autore').value;
        if(!titolo || !autore) {
            alert("Compila almeno Titolo e Autore!");
            return;
        }
        alert("Libro salvato con successo! (Funzione di salvataggio pronta)");
    }
</script>

</body>
</html>
