<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libreria Virtuale - Angolo Letterario</title>
    <!-- Libreria per la scansione dei codici a barre tramite fotocamera -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #f3efe6;
            --card-bg: #fffcf8;
            --primary-color: #2e4033;
            --accent-color: #557a46;
            --accent-hover: #436136;
            --edit-color: #2b6cb0;
            --edit-hover: #2c5282;
            --danger-color: #b83b3b;
            --danger-hover: #962f2f;
            --text-color: #232c25;
            --text-light: #607064;
            --border-color: #d6e2d9;
            --badge-bg: #e2ede5;
            --badge-color: #314a36;
            --clo-bg: #e1f5fe;
            --clo-color: #01579b;
            --maki-bg: #fce4ec;
            --maki-color: #880e4f;
            --both-bg: #e8f5e9;
            --both-color: #1b5e20;
            --unread-bg: #fce4d6;
            --unread-color: #c65911;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 30px 20px;
            background-image: radial-gradient(#cbdad0 1px, transparent 1px), radial-gradient(#cbdad0 1px, var(--bg-color) 1px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 25px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.85);
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(46, 64, 51, 0.05);
        }

        .header-titles h1 {
            color: var(--primary-color);
            font-size: 2.3rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .header-titles p {
            color: var(--text-light);
            font-size: 1.05rem;
            font-style: italic;
            margin-bottom: 20px;
        }

        .header-filters-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .search-container {
            position: relative;
            width: 300px;
        }

        .search-container input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #fff;
            color: var(--text-color);
            transition: all 0.2s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .search-container input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(85, 122, 70, 0.15);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 25px;
            align-items: start;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Menu a tendina migliorati per mobile e desktop */
        .accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(46, 64, 51, 0.04);
        }

        .accordion-header {
            background: #fff;
            padding: 15px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            user-select: none;
            transition: background 0.2s;
        }

        .accordion-header:hover {
            background: #f4f8f5;
        }

        .accordion-content {
            display: none;
            padding: 15px;
            background: #fafcfb;
            border-top: 1px solid var(--border-color);
            flex-direction: column;
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
        }

        .accordion-item.active .accordion-content {
            display: flex;
        }

        .filter-pill {
            background-color: #fff;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: left;
        }

        .filter-pill:hover {
            border-color: var(--accent-color);
            background-color: #f0f5f1;
        }

        .filter-pill.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 2px 6px rgba(46, 64, 51, 0.2);
        }

        .btn-toggle-form {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(46, 64, 51, 0.1);
        }

        .btn-toggle-form:hover {
            background-color: #213025;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 6px 15px rgba(46, 64, 51, 0.06);
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        #formCard {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 1.35rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--primary-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fff;
            color: var(--text-color);
            transition: all 0.2s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(85, 122, 70, 0.15);
        }

        button[type="submit"] {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        button[type="submit"]:hover {
            background-color: var(--accent-hover);
        }

        .scanner-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .btn-scanner {
            background-color: #3b5998;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background 0.2s;
            flex: 1;
            justify-content: center;
        }

        .btn-scanner:hover {
            background-color: #2d4373;
        }

        .btn-manual-search {
            background-color: #4a5568;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background 0.2s;
            flex: 1;
            justify-content: center;
        }

        .btn-manual-search:hover {
            background-color: #2d3748;
        }

        #reader-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 15px auto;
            display: none;
        }

        .author-item {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            background: var(--card-bg);
            transition: box-shadow 0.2s;
        }

        .author-item:hover {
            box-shadow: 0 4px 10px rgba(46, 64, 51, 0.05);
        }

        .author-header {
            background: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .author-header:hover {
            background: #f4f8f5;
        }

        .author-name {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .author-badge {
            background: var(--badge-bg);
            color: var(--badge-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .author-content {
            display: none;
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            background: #f5f9f6;
        }

        .author-item.active .author-content {
            display: block;
        }

        .book-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .book-details {
            flex-grow: 1;
        }

        .book-info h4 {
            font-size: 1.05rem;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .book-tags {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .genre-tag {
            background: #e8f0eb;
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .read-status {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .read-status.clo { background: var(--clo-bg); color: var(--clo-color); }
        .read-status.maki { background: var(--maki-bg); color: var(--maki-color); }
        .read-status.entrambi { background: var(--both-bg); color: var(--both-color); }
        .read-status.nessuno { background: var(--unread-bg); color: var(--unread-color); }

        .book-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .copies-badge {
            background: #e8f0eb;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .btn-edit {
            background-color: var(--edit-color);
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background 0.2s;
        }

        .btn-edit:hover {
            background-color: var(--edit-hover);
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background-color: var(--danger-hover);
        }

        .empty-state {
            text-align: center;
            color: var(--text-light);
            padding: 25px;
            font-style: italic;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--accent-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Ottimizzazione grafica per Mobile / Smartphone */
        @media (max-width: 950px) {
            .main-layout {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
            
            /* Spostiamo i filtri sopra la lista dei libri su mobile per comodità */
            .sidebar {
                order: -1;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 10px;
            }
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            header { padding: 15px 10px; }
            .header-titles h1 { font-size: 1.5rem; }
            .header-titles p { font-size: 0.9rem; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            .header-filters-row { flex-direction: column; width: 100%; gap: 10px; }
            .search-container { width: 100%; }
            .btn-toggle-form { width: 100%; justify-content: center; }
            .scanner-actions { flex-direction: column; }
            .book-card { flex-direction: column; align-items: stretch; gap: 12px; }
            .book-actions { justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 10px; }
            .card { padding: 15px; }
            .sidebar { display: flex; flex-direction: column; }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div class="header-titles">
                <h1>Biblioteca virtuale dei bucetti topolinetti 🌿</h1>
                <p>Collezione letteraria e archivio delle letture di Clo & Maki</p>
            </div>
            <div class="header-filters-row">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Cerca libro o autore..." oninput="renderLibrary()">
                </div>
                <button class="btn-toggle-form" onclick="toggleForm()">
                    <span>➕ Aggiungi un Nuovo Libro</span>
                </button>
            </div>
        </header>

        <div class="main-layout">
            <div class="main-content">
                <div class="card" id="formCard">
                    <h2 id="formTitle">Aggiungi un Nuovo Libro</h2>
                    
                    <div id="scanner-section">
                        <div class="scanner-actions">
                            <button type="button" class="btn-scanner" onclick="avviaScanner()">📷 Scansiona ISBN</button>
                            <button type="button" class="btn-manual-search" onclick="cercaPerTitoloWeb()">🔍 Cerca per Nome/Titolo</button>
                        </div>
                        <div id="reader-container">
                            <div id="reader"></div>
                            <button type="button" class="btn-delete" style="margin-top: 10px; width: 100%;" onclick="chiudiScanner()">Chiudi Fotocamera</button>
                        </div>
                    </div>

                    <form id="bookForm">
                        <input type="hidden" id="editId" value="">
                        <div class="form-grid">
                            <div class="form-group full">
                                <label for="titolo">Titolo del libro *</label>
                                <input type="text" id="titolo" required placeholder="es. Grandi Speranze">
                            </div>
                            <div class="form-group">
                                <label for="autore">Autore *</label>
                                <input type="text" id="autore" required placeholder="es. Charles Dickens">
                            </div>
                            <div class="form-group">
                                <label for="isbn">Codice ISBN (opzionale)</label>
                                <input type="text" id="isbn" placeholder="es. 9788804668268">
                            </div>
                            <div class="form-group">
                                <label for="genere">Genere Letterario</label>
                                <select id="genere">
                                    <option value="Romanzi">Romanzi</option>
                                    <option value="Manga&Artbook">Manga&Artbook</option>
                                    <option value="Graphic Novel">Graphic Novel</option>
                                    <option value="Fanfiction">Fanfiction</option>
                                    <option value="Libri di Studio">Libri di Studio</option>
                                    <option value="Libri di musica">Libri di musica</option>
                                    <option value="Poesia">Poesia</option>
                                    <option value="Altro">Altro</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="copie">Numero di copie</label>
                                <input type="number" id="copie" min="1" value="1">
                            </div>
                            <div class="form-group full">
                                <label for="lettoDa">Chi lo ha letto?</label>
                                <select id="lettoDa">
                                    <option value="Nessuno">Nessuno (Non ancora letto)</option>
                                    <option value="Clo">Clo</option>
                                    <option value="Maki">Maki</option>
                                    <option value="Entrambi">Entrambi</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" id="submitBtn">Salva nella Libreria</button>
                        <button type="button" id="cancelEditBtn" style="display:none; background-color: #718096; margin-top: 10px;" class="filter-pill" onclick="resetFormToCreate()">Annulla Modifica</button>
                    </form>
                </div>

                <div class="card">
                    <div class="stats" id="statsBar"></div>
                    <div id="authorsList"></div>
                </div>
            </div>

            <aside class="sidebar">
                <div class="accordion-item" id="authorAccordion">
                    <div class="accordion-header" onclick="toggleAccordion('authorAccordion')">
                        <span>✍️ Filtra per Autore</span>
                        <span>▾</span>
                    </div>
                    <div class="accordion-content" id="authorPillsBar"></div>
                </div>

                <div class="accordion-item" id="genreAccordion">
                    <div class="accordion-header" onclick="toggleAccordion('genreAccordion')">
                        <span>🏷️ Filtra per Genere</span>
                        <span>▾</span>
                    </div>
                    <div class="accordion-content" id="genrePillsBar">
                        <button class="filter-pill active" onclick="setGenreFilter('')">Tutti i generi</button>
                        <button class="filter-pill" onclick="setGenreFilter('Romanzi')">Romanzi</button>
                        <button class="filter-pill" onclick="setGenreFilter('Manga&Artbook')">Manga&Artbook</button>
                        <button class="filter-pill" onclick="setGenreFilter('Graphic Novel')">Graphic Novel</button>
                        <button class="filter-pill" onclick="setGenreFilter('Fanfiction')">Fanfiction</button>
                        <button class="filter-pill" onclick="setGenreFilter('Libri di Studio')">Libri di Studio</button>
                        <button class="filter-pill" onclick="setGenreFilter('Libri di musica')">Libri di musica</button>
                        <button class="filter-pill" onclick="setGenreFilter('Poesia')">Poesia</button>
                    </div>
                </div>

                <div class="accordion-item" id="readerAccordion">
                    <div class="accordion-header" onclick="toggleAccordion('readerAccordion')">
                        <span>👥 Filtra per Lettore</span>
                        <span>▾</span>
                    </div>
                    <div class="accordion-content" id="readerPillsBar">
                        <button class="filter-pill active" onclick="setReaderFilter('')">Tutti</button>
                        <button class="filter-pill" onclick="setReaderFilter('Clo')">Letto da Clo</button>
                        <button class="filter-pill" onclick="setReaderFilter('Maki')">Letto da Maki</button>
                        <button class="filter-pill" onclick="setReaderFilter('Entrambi')">Entrambi</button>
                        <button class="filter-pill" onclick="setReaderFilter('Nessuno')">Non letto</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const defaultBooks = [
            // Fanfiction & Altri
            { id: "1710000001001", titolo: "All my cards are here", autore: "Autore Fanfiction", genere: "Fanfiction", copie: 1 },
            { id: "1710000001002", titolo: "All the young dudes 1", autore: "Autore Fanfiction", genere: "Fanfiction", copie: 1 },
            { id: "1710000001003", titolo: "All the young dudes 2", autore: "Autore Fanfiction", genere: "Fanfiction", copie: 1 },
            { id: "1710000001004", titolo: "All the young dudes 3", autore: "Autore Fanfiction", genere: "Fanfiction", copie: 1 },

            // Romanzi / Fantasy / Classici
            { id: "1710000001005", titolo: "Harry Potter e la pietra filosofale", autore: "J.K. Rowling", genere: "Romanzi", copie: 1 },
            { id: "1710000001006", titolo: "Harry Potter e la camera dei segreti", autore: "J.K. Rowling", genere: "Romanzi", copie: 1 },
            { id: "1710000001007", titolo: "Harry Potter e il prigioniero di Azkaban", autore: "J.K. Rowling", genere: "Romanzi", copie: 1 },
            { id: "1710000001008", titolo: "Harry Potter e il calice di fuoco", autore: "J.K. Rowling", genere: "Romanzi", copie: 1 },
            { id: "1710000001009", titolo: "Harry Potter e l’ordine della fenice", autore: "J.K. Rowling", genere: "Romanzi", copie: 1 },
            { id: "1710000001010", titolo: "Harry Potter e il principe mezzosangue", autore: "J.K. Rowling", genere: "Romanzi", copie: 1 },
            { id: "1710000001011", titolo: "Harry Potter e i doni della morte", autore: "J.K. Rowling", genere: "Romanzi", copie: 1 },
            { id: "1710000001012", titolo: "Harry Potter e la pietra filosofale (vol castello)", autore: "J.K. Rowling", genere: "Romanzi", copie: 1 },
            { id: "1710000001013", titolo: "Percy Jackson e gli dei dell’Olimpo, Il ladro di fulmini", autore: "Rick Riordan", genere: "Romanzi", copie: 1 },
            { id: "1710000001014", titolo: "Percy Jackson e gli dei dell’Olimpo, Il mare dei mostri", autore: "Rick Riordan", genere: "Romanzi", copie: 1 },

        async function cercaLibroAutomatico(query) {
            query = query.trim();
            
            if (/^\d{10,13}$/.test(query)) {
                document.getElementById('isbn').value = query;
                if (await cercaGoogleBooksIsbn(query)) return;
                if (await cercaOpenLibraryIsbn(query)) return;
            } else {
                if (await cercaGoogleBooksTesto(query)) return;
            }

            alert("Libro non trovato nei database automatici. Inserisci i dati manualmente nei campi sottostanti.");
        }

        async function cercaGoogleBooksIsbn(isbn) {
            try {
                let res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
                let dati = await res.json();
                if (dati.totalItems > 0 && dati.items) {
                    riempiCampiDaGoogle(dati.items[0]);
                    return true;
                }
            } catch (e) { console.log("Errore Google ISBN", e); }
            return false;
        }

        async function cercaOpenLibraryIsbn(isbn) {
            try {
                let res = await fetch(`https://openlibrary.org/isbn/${isbn}.json`);
                if (!res.ok) return false;
                let data = await res.json();
                if (data.title) {
                    document.getElementById('titolo').value = data.title;
                    if (data.authors && data.authors.length > 0) {
                        let authRes = await fetch(`https://openlibrary.org${data.authors[0].key}.json`);
                        if (authRes.ok) {
                            let authData = await authRes.json();
                            if (authData.name) document.getElementById('autore').value = authData.name;
                        }
                    }
                    return true;
                }
            } catch (e) { console.log("Errore OpenLibrary ISBN", e); }
            return false;
        }

        async function cercaGoogleBooksTesto(testo) {
            try {
                let res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(testo)}`);
                let dati = await res.json();
                if (dati.totalItems > 0 && dati.items) {
                    riempiCampiDaGoogle(dati.items[0]);
                    return true;
                }
            } catch (e) { console.log("Errore Google Testo", e); }
            return false;
        }

        function riempiCampiDaGoogle(item) {
            let info = item.volumeInfo;
            if (info.title) document.getElementById('titolo').value = info.title;
            if (info.authors) document.getElementById('autore').value = info.authors.join(", ");
            if (item.id) {
                let isbnObj = info.industryIdentifiers?.find(i => i.type === "ISBN_13" || i.type === "ISBN_10");
                if (isbnObj) document.getElementById('isbn').value = isbnObj.identifier;
            }
        }

        function updateSelectOptions() {
            const authors = Array.from(new Set(libri.map(l => l.autore))).sort();
            let html = `<button class="filter-pill ${selectedAuthor === '' ? 'active' : ''}" onclick="setAuthorFilter('')">Tutti gli autori</button>`;
            
            authors.forEach(a => {
                const isActive = (a === selectedAuthor) ? 'active' : '';
                html += `<button class="filter-pill ${isActive}" onclick="setAuthorFilter('${a.replace(/'/g, "\\'")}')">${a}</button>`;
            });

        function renderLibrary() {
            const searchTerm = searchInput.value.toLowerCase();

            const libriFiltrati = libri.filter(l => {
                const matchSearch = l.autore.toLowerCase().includes(searchTerm) ||
                    l.titolo.toLowerCase().includes(searchTerm) ||
                    (l.genere && l.genere.toLowerCase().includes(searchTerm));

                const matchAuthor = !selectedAuthor || l.autore === selectedAuthor;
                const matchGenre = !selectedGenre || (l.genere || 'Non specificato') === selectedGenre;
                let matchReader = true;
                if (selectedReader) {
                    matchReader = (l.lettoDa === selectedReader);
                }

                return matchSearch && matchAuthor && matchGenre && matchReader;
            });

            const totalCopie = libri.reduce((sum, l) => sum + l.copie, 0);
            const totalLettiClo = libri.filter(l => l.lettoDa === 'Clo' || l.lettoDa === 'Entrambi').length;
            const totalLettiMaki = libri.filter(l => l.lettoDa === 'Maki' || l.lettoDa === 'Entrambi').length;

            statsBar.innerHTML = `<span>Libri totali: ${totalCopie}</span><span>Letti Clo: ${totalLettiClo}</span><span>Letti Maki: ${totalLettiMaki}</span>`;

            if (libriFiltrati.length === 0) {
                authorsList.innerHTML = `<div class="empty-state">Nessun libro trovato con i filtri selezionati.</div>`;
                return;
            }

            const autoriDict = {};
            libriFiltrati.forEach(libro => {
                if (!autoriDict[libro.autore]) {
                    autoriDict[libro.autore] = [];
                }
                autoriDict[libro.autore].push(libro);
            });

            const autoriOrdinati = Object.keys(autoriDict).sort();
            let html = '';

            autoriOrdinati.forEach((autore) => {
                const opere = autoriDict[autore];
                const copieAutore = opere.reduce((sum, l) => sum + l.copie, 0);

                let badgeText = `${opere.length}`;
                if (copieAutore !== opere.length) {
                    badgeText = `${opere.length} (${copieAutore})`;
                }

                html += `
                    <div class="author-item">
                        <div class="author-header" onclick="toggleAuthor(this)">
                            <span class="author-name">📖 ${autore}</span>
                            <span class="author-badge">${badgeText}</span>
                        </div>
                        <div class="author-content">
                `;

                opere.forEach(libro => {
                    let statusClass = 'nessuno';
                    let statusText = '⏳ Non letto';

                    if (libro.lettoDa === 'Clo') {
                        statusClass = 'clo';
                        statusText = '👤 Letto da Clo';
                    } else if (libro.lettoDa === 'Maki') {
                        statusClass = 'maki';
                        statusText = '👤 Letto da Maki';
                    } else if (libro.lettoDa === 'Entrambi') {
                        statusClass = 'entrambi';
                        statusText = '👥 Letto da entrambi';
                    }

                    const genere = libro.genere || 'Non specificato';

                    html += `
                        <div class="book-card">
                            <div class="book-details">
                                <div class="book-info">
                                    <h4>📜 ${libro.titolo}</h4>
                                    <div class="book-tags">
                                        <span class="genre-tag">🏷️ ${genere}</span>
                                        <span class="read-status ${statusClass}">${statusText}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="book-actions">
                                <span class="copies-badge">Copie: ${libro.copie}</span>
                                <button class="btn-edit" onclick="caricaDatiPerModifica('${libro.id}')">Modifica</button>
                                <button class="btn-delete" onclick="eliminaLibro('${libro.id}')">Rimuovi</button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            authorsList.innerHTML = html;
        }

        function toggleAuthor(headerElement) {
            const item = headerElement.parentElement;
            const content = item.querySelector('.author-content');
            content.style.display = (content.style.display === 'block') ? 'none' : 'block';
        }

        updateSelectOptions();
        renderLibrary();
    </script>
</body>

</html>
